services:
  postgres:
    image: postgres:17
    container_name: secure-bank-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}

      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth_service_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}

      ACCOUNT_DB_NAME: ${ACCOUNT_DB_NAME:-account_db}
      ACCOUNT_DB_USERNAME: ${ACCOUNT_DB_USERNAME:-account_service_user}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}

      TRANSACTION_DB_NAME: ${TRANSACTION_DB_NAME:-transaction_db}
      TRANSACTION_DB_USERNAME: ${TRANSACTION_DB_USERNAME:-transaction_service_user}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?TRANSACTION_DB_PASSWORD is required}

      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-audit_db}
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit_service_user}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
